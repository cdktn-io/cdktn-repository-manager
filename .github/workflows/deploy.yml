name: "Deploy"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: read

jobs:
  build-shard-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: set-matrix
        run: |
          # custom-constructs isn't a provider shard in sharded-stacks.json --
          # it manages hand-built construct packages (e.g. cdktn-awscc) via
          # CustomConstructsStack -- so it's appended here explicitly.
          stack=$(jq -rcM '.stacks | { stack: (keys + ["custom-constructs"]) }' sharded-stacks.json)
          echo "matrix=$stack" >> $GITHUB_OUTPUT

  deploy:
    uses: ./.github/workflows/deploy-cdktf-stacks.yml
    needs: build-shard-matrix
    with:
      stacks: ${{ needs.build-shard-matrix.outputs.matrix }}
      upgrade-repositories: true
    secrets: inherit

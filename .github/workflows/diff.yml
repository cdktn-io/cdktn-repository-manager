name: "Plan"

on: [pull_request_target]
concurrency: ${{ github.workflow }}-${{ github.head_ref }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build-shard-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - id: set-matrix
        run: |
          # custom-constructs isn't a provider shard in sharded-stacks.json --
          # it manages hand-built construct packages (e.g. cdktn-awscc) via
          # CustomConstructsStack -- so it's appended here explicitly.
          stack=$(jq -rcM '.stacks | { stack: (keys + ["custom-constructs"]) }' sharded-stacks.json)
          echo "matrix=$stack" >> $GITHUB_OUTPUT

  diff:
    uses: ./.github/workflows/diff-cdktf-stacks.yml
    needs: build-shard-matrix
    with:
      stacks: ${{ needs.build-shard-matrix.outputs.matrix }}
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}
    secrets: inherit

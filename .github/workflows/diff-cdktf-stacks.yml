name: "Diff CDKTF Stack"

on:
  workflow_call:
    inputs:
      stacks:
        required: true
        description: JSON-stringified list of stacks to deploy, e.g. # [{ "stack": "my-stack" }]
        type: string
      ref:
        required: true
        description: The SHA ref of the commit to check out
        type: string
      repository:
        required: true
        description: The fully qualified name of the repository to check out the commit from
        type: string

jobs:
  terraform:
    name: "Terraform CDK Diff"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(inputs.stacks)}}
      max-parallel: 10
    env:
      STACK: ${{ matrix.stack }}

    steps:
      - name: Validate stack name
        run: |-
          if ! [[ "$STACK" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Refusing to run on unsafe stack name: $STACK"
            exit 1
          fi
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Scoped to the org because `terraform plan` reads vulnerability_alerts on
          # every managed provider repo. Narrowing to `cdktn-repository-manager` only
          # breaks plan with 403s. A finer-grained App with limited perms is the
          # right longer-term fix; out of scope for this PR.
          owner: cdktn-io

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::237921648970:role/repo-manager-githubleGitHubActionsRole20260204020651378700000001
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install
        run: yarn install --ignore-scripts
      - name: Synth
        run: "$(yarn bin)/cdktf synth"
      - name: Write Terraform variables
        env:
          VAR_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VAR_GH_APP_ID: ${{ secrets.GH_APP_ID }}
          VAR_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          VAR_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VAR_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          VAR_TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          VAR_TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          VAR_GH_COMMENT_TOKEN: ${{ secrets.GH_COMMENT_TOKEN }}
          VAR_ALERT_PRS_SLACK_WEBHOOK_URL: ${{ secrets.ALERT_PRS_SLACK_WEBHOOK_URL }}
          VAR_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          VAR_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          VAR_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          VAR_MAVEN_GPG_PRIVATE_KEY_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSPHRASE }}
          VAR_MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          STACK_DIR="cdktf.out/stacks/$STACK"
          VARS="{}"
          for var in $(jq -r '.variable | keys[]' "$STACK_DIR/cdk.tf.json"); do
            ENV_NAME="VAR_$(echo "$var" | tr 'a-z-' 'A-Z_')"
            VARS=$(echo "$VARS" | jq --arg key "$var" --arg val "${!ENV_NAME}" '. + {($key): $val}')
          done
          echo "$VARS" > "$STACK_DIR/terraform.tfvars.json"
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          cd "cdktf.out/stacks/$STACK"
          rm -rf .terraform
          terraform init
          terraform plan -no-color | tee "../../../plan_stdout_${STACK}.txt"; echo $?
          set +o pipefail
        continue-on-error: true
      - name: Save results into a variable
        id: plan_outcome
        run: echo "value=${{steps.plan.outcome}}" >> $GITHUB_OUTPUT
      - name: Comment the plan output on the PR
        if: contains(github.event_name, 'pull_request') # pull_request or pull_request_target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          STACK_NAME: ${{ matrix.stack }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {resolve} = require('path')
            const scriptPath = resolve("./.github/lib/comment-plan-output")
            require(scriptPath)({
              context,
              github,
              planOutcome: "${{steps.plan.outcome}}",
              pusher: "${{github.actor}}",
              actionName: "${{github.event_name}}",
              workingDirectory: "${{env.tf_actions_working_dir}}",
              workflowName: "${{github.workflow}}",
              stackName: process.env.STACK_NAME
            })
      - name: Fail this check if the plan was not successful
        if: steps.plan_outcome.outputs.value != 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            core.setFailed('Terraform plan was not successful')

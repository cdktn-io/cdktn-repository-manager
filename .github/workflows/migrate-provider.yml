name: Migrate Provider to CDKTN Scope
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider name (key from provider.json, e.g., "aws", "google", "random")'
        required: true
        type: string
      import_pr_number:
        description: 'PR number in cdktn-repository-manager that triggered this migration (for posting back a status comment)'
        required: false
        type: string

jobs:
  migrate-provider-repo:
    name: Migrate provider to @cdktn scope
    # runs-on: ubuntu-latest
    runs-on: depot-ubuntu-24.04-8
    env:
      PROVIDER_REPO: ${{ format('cdktn-io/cdktn-provider-{0}', inputs.provider) }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cdktn-io
          repositories: ${{ format('cdktn-provider-{0}', inputs.provider) }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout provider repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.PROVIDER_REPO }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      # Runs on depot-ubuntu-24.04-8, which tracks the GitHub runner image: yarn 1.x
      # is preinstalled but pnpm is not. Must precede setup-node.
      # Keep in sync with @cdktn/provider-project's pnpm version.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.33.0"

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Also installs @cdktn/provider-project and synths a provider repo, so it
          # must satisfy both engines floors -- see the note in upgrade-repositories.yml.
          node-version: "24"

      - name: Setup Copywrite tool
        uses: hashicorp/setup-copywrite@32638da2d4e81d56a0764aa1547882fc4d209636 # v1.1.3

      - name: Install dependencies
        # The repo being migrated is still yarn-based at this point, but projen will
        # switch it to pnpm below and delete yarn.lock, so install with pnpm from the
        # start rather than leaving a half-yarn/half-pnpm tree behind.
        run: pnpm install --no-frozen-lockfile

      - name: Migrate to @cdktn scope
        run: |
          # Update require statement, project type, isDeprecated flag
          sed -i 's|@cdktf/provider-project|@cdktn/provider-project|g' .projenrc.js
          sed -i 's/CdktfProviderProject/CdktnProviderProject/g' .projenrc.js
          sed -i "s/isDeprecated: true,/isDeprecated: false,/" .projenrc.js

          # Update minNodeVersion to satisfy @cdktn/provider-project engine requirement (>= 20.16.0)
          sed -i 's/minNodeVersion: "20\.9\.0"/minNodeVersion: "20.16.0"/' .projenrc.js

          # Verify changes were made
          grep -q "@cdktn/provider-project" .projenrc.js || {
            echo "Error: Migration failed - @cdktn/provider-project not found"
            exit 1
          }

      - name: Upgrade to latest @cdktn/provider-project
        run: |
          pnpm add -D @cdktn/provider-project@latest
          # projen >=0.101.7 is required for the pnpm APIs the template uses --
          # see the note in upgrade-repositories.yml.
          pnpm add -D projen@^0.101.20

      - name: Regenerate with projen
        run: |
          unset CI
          npx projen
          # `unset CI` is load-bearing under pnpm: CI=true implies --frozen-lockfile
          # and the projen run above rewrites package.json.
          pnpm install --no-frozen-lockfile
          # `pnpm run fetch`, NOT `pnpm fetch` -- the latter is a pnpm builtin that
          # fetches from the lockfile and generates nothing while exiting 0.
          pnpm run fetch
          # Fix readme (requires src/version.json to be populated)
          npx projen

      - name: Add headers using Copywrite tool
        run: copywrite headers

      - name: Build and verify
        run: |
          # unset CI so projen's build doesn't spawn install:ci (--frozen-lockfile)
          unset CI
          pnpm run build

        # the build bumps package.json, must reset after build!
      - name: Reset the version in package.json
        run: npm pkg set version="0.0.0"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: auto/migrate-to-cdktn-scope
          base: main
          commit-message: "feat: migrate to cdktn-io scope"
          title: "feat: migrate to cdktn-io scope"
          body: |
            ## Summary

            This PR migrates the provider from `@cdktf/provider-project` to `@cdktn/provider-project` for cdktn-io managed pre-built providers.

            ## Changes

            - Updated require statement in .projenrc.js
            - Updated Projen Project type name (CdktfProviderProject → CdktnProviderProject)
            - Updated devDeps to use @cdktn/provider-project@latest
            - Reverted provider deprecation flag (isDeprecated: false)
            - Regenerated all files with projen
            - Verified build succeeds

            ## Migration Context

            As part of the CDKTF → CDKTN migration following HashiCorp's sunset of the CDKTF project (December 10, 2025), all provider bindings are being republished under the `@cdktn` npm scope.
          labels: |
            automerge
            auto-approve
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          delete-branch: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Post status comment on import PR
        if: inputs.import_pr_number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          MIGRATION_PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          MIGRATION_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PROVIDER: ${{ inputs.provider }}
          IMPORT_PR_NUMBER: ${{ inputs.import_pr_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const migrationPrNumber = process.env.MIGRATION_PR_NUMBER;
            const migrationPrUrl = process.env.MIGRATION_PR_URL;
            const provider = process.env.PROVIDER;
            const body = migrationPrNumber
              ? [
                  `## 🔀 Migration PR opened for \`${provider}\``,
                  '',
                  `The [migration PR](${migrationPrUrl}) has been opened in \`cdktn-provider-${provider}\` and auto-merge is enabled.`,
                  '',
                  '### Next steps:',
                  `- Once the migration PR merges, merge this PR`,
                  `- If needed, manually dispatch \`release\` (with a \`sha\` and the \`publish_to_*\` toggles) on \`cdktn-provider-${provider}\` for initial publish`,
                ].join('\n')
              : `## ⚠️ Migration workflow ran for \`${provider}\` but no PR was created (it may already exist on \`auto/migrate-to-cdktn-scope\`).`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.IMPORT_PR_NUMBER, 10),
              body,
            });

      - name: Send failures to Slack
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.FAILURE_SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "provider_name": "${{ inputs.provider }}",
              "run_url": "https://github.com/cdktn-io/cdktn-repository-manager/actions/runs/${{ github.run_id }}"
            }

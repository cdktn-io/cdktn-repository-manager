name: Deprecate a prebuilt provider
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider name (key from provider.json file)"
        required: true
        type: string
env:
  PROVIDER: ${{ inputs.provider }}
  PROVIDER_REPO: ${{ format('cdktn-provider-{0}', inputs.provider) }}
  PROVIDER_REPO_FULL: ${{ format('cdktn-io/cdktn-provider-{0}', inputs.provider) }}
jobs:
  update_provider:
    name: Create a PR in the provider repo to mark it as deprecated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf  # v2.2.1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cdktn-io
          repositories: ${{ env.PROVIDER_REPO }}
      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.PROVIDER_REPO_FULL }}
          token: ${{ steps.app-token.outputs.token }}
      # This job operates on a PROVIDER repo, so it needs pnpm and Node >= the
      # template's minNodeVersion. Keep in sync with @cdktn/provider-project.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.33.0"
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Provider repos declare engines node>=24.11.0; installing on Node 20 fails
          # the engines check outright.
          node-version: "24"
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Kick off the deprecation
        run: |
          sed -i "s/isDeprecated: false,/isDeprecated: true,/" .projenrc.js
      - name: Do a build
        run: |
          # unset CI so projen's build doesn't spawn install:ci (--frozen-lockfile)
          # after the sed above changes what projen will synthesize
          unset CI
          pnpm install --no-frozen-lockfile && pnpm run build
      - name: Reset the version in package.json
        run: npm pkg set version="0.0.0"
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: auto/deprecate-${{ inputs.provider }}
          base: main
          commit-message: "chore: mark this prebuilt provider package as deprecated"
          title: "chore: mark this prebuilt provider package as deprecated"
          body: |
            CDK Terrain has made the decision to stop publishing new versions of prebuilt Terraform `${{ inputs.provider }}` provider
            bindings for [CDK Terrain](https://cdktn.io). Once this PR is merged, this repository will be archived and will no longer
            be supported in any way by CDK Terrain. Previously-published versions of this prebuilt provider will still continue to be
            available on their respective package managers (e.g. npm, PyPi, Maven, NuGet), but these will not be compatible with
            new releases of `cdktn` and are no longer eligible for commercial support.

            As a reminder, you can continue to use the `${{ inputs.provider }}` provider in your CDK Terrain (cdktn) projects,
            even with newer versions of cdktn, but you will need to generate the bindings locally. The easiest way to do so is to use
            the [`provider add` command](https://cdktn.io/docs/cli-reference/commands#provider-add) with the
            `--force-local` flag enabled. For more information, check out our documentation on [generating provider bindings manually](https://cdktn.io/docs/concepts/providers).
          labels: automated,auto-approve,automerge
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          signoff: true
          delete-branch: true
      - name: Get NuGet package name
        id: nuget
        run: |-
          NUGET_PACKAGE=$(npm pkg get jsii.targets.dotnet.packageId | tr -d '"')
          echo "package=$NUGET_PACKAGE"
          echo "package=$NUGET_PACKAGE" >> $GITHUB_OUTPUT
    outputs:
      pr_id: ${{ steps.cpr.outputs.pull-request-number }}
      provider_repo: ${{ env.PROVIDER_REPO_FULL }}
      nuget_package: ${{ steps.nuget.outputs.package }}
  update_self:
    name: Create a PR in this repo to archive the provider repo
    runs-on: ubuntu-latest
    needs: [update_provider]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
      - name: Install
        run: yarn install
      - name: Remove the provider from our configuration
        run: |
          sed -i '/"'"$PROVIDER"'"/d' provider.json
          sed -i '/"'"$PROVIDER"'"/d' sharded-stacks.json
          sed -i '/"'"$PROVIDER"'"/d' providersWithCustomRunners.json
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          branch: auto/deprecate-${{ inputs.provider }}
          base: main
          commit-message: "feat: deprecate and archive prebuilt bindings for ${{ inputs.provider }} provider"
          title: "feat: deprecate and archive prebuilt bindings for ${{ inputs.provider }} provider"
          body: |
            CDK Terrain has made the decision to stop publishing new versions of prebuilt Terraform `${{ inputs.provider }}` provider bindings for
            [CDK Terrain](https://cdktn.io). Once this PR is merged, the [${{ needs.update_provider.outputs.provider_repo }}](https://github.com/${{ needs.update_provider.outputs.provider_repo }}) repository will be archived and will no longer
            be supported in any way by CDK Terrain. Previously-published versions of the prebuilt `${{ inputs.provider }}` provider will still continue
            to be available on their respective package managers (e.g. npm, PyPi, Maven, NuGet), but these will not be compatible with
            new releases of `cdktn` and are no longer eligible for commercial support.

            Please complete the following steps in this exact order to complete the deprecation process:

            - [ ] Double-check `provider.json`, `sharded-stacks.json`, and `providersWithCustomRunners.json` in this PR for any syntax errors caused by extraneous commas
            - [ ] Mark this PR as ready for review and examine the plan output from the checks to confirm the correct resources are destroyed
            - [ ] Approve and merge ${{ needs.update_provider.outputs.provider_repo }}#${{ needs.update_provider.outputs.pr_id }} and ensure that the release is published to all package managers
                - N.B. New published versions take 6~8 hours to show up in Maven, but you do not need to wait for that, just ensure that the `release_maven` job completed successfully
            - [ ] [Manually deprecate](https://learn.microsoft.com/en-us/nuget/nuget-org/deprecate-packages) the `${{ needs.update_provider.outputs.nuget_package }}` package in NuGet Gallery _(optional but recommended)_
                - Provide the following custom message: _CDK Terrain is no longer publishing new versions of the prebuilt provider for ${{ inputs.provider }}. Previously-published versions of this prebuilt provider will still continue to be available as installable packages on NuGet, but these will not be compatible with newer versions of CDK Terrain and are not eligible for commercial support. You can continue to use the ${{ inputs.provider }} provider in your CDK Terrain projects with newer versions of cdktn, but you will need to generate the bindings locally. See https://cdktn.io/docs/concepts/providers for details._
            - [ ] Remove the "do-not-merge" label and merge this PR

            Please also ensure that not too much time passes in between each of these steps. Notably, if the PR in the provider repo is
            merged but other changes are deployed before that repo is properly archived, there could be unintended behavior. So, it is 
            highly recommended that you complete the above steps in short succession.
          labels: automated,do-not-merge
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          signoff: true
          delete-branch: true
          draft: true

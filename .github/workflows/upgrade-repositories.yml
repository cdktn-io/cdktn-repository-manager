name: "Upgrade Provider Repositories"

on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Space/comma-separated provider keys to upgrade (empty = all). Useful for canarying a rollout."
        type: string
        required: false
        default: ""
  workflow_call: {}

jobs:
  build-provider-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: set-matrix
        env:
          PROVIDERS_INPUT: ${{ inputs.providers }}
        run: |
          if [ -n "$PROVIDERS_INPUT" ]; then
            # Filter to the requested keys (intersected with provider.json so
            # typos drop out and produce a visibly empty matrix).
            provider=$(jq -rcM --arg list "$PROVIDERS_INPUT" \
              '($list | gsub("[,]"; " ") | split(" ") | map(select(length > 0))) as $sel
               | { provider: [ keys[] | select(. as $k | $sel | index($k)) ] }' \
              provider.json)
          else
            provider=$(jq -rcM "{ provider: keys }" provider.json)
          fi
          echo "matrix=$provider" >> $GITHUB_OUTPUT

  sync-template:
    name: "Sync template repository"
    runs-on: ubuntu-latest
    container:
      image: terraconstructs/jsii-terraform@sha256:8a260318e59d1debad735c328581261f2c469584191ec50783dad135837b4127
    steps:
      - name: Checkout this repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: main

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cdktn-io
          repositories: cdktn-provider-template

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout cdktn-provider-template Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: cdktn-io/cdktn-provider-template
          token: ${{ steps.app-token.outputs.token }}
          path: template

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.33.0"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Setup Copywrite tool
        uses: hashicorp/setup-copywrite@32638da2d4e81d56a0764aa1547882fc4d209636 # v1.1.3

      - name: Prepare synth scratch directory
        # create-projen-files.js writes .projenrc.js to $GITHUB_WORKSPACE/provider,
        # so the scratch project has to live at exactly that path. `pnpm add` needs
        # a package.json to add to, and the directory starts out empty.
        run: |
          mkdir -p provider
          printf '%s\n' '{"name":"cdktn-provider-template-synth","version":"0.0.0","private":true}' > provider/package.json

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        name: Create projen run commands file
        with:
          # The template's files are provider-independent, so any provider key
          # from provider.json yields the same bytes; "null" is used because it
          # takes every default (no custom runner, no trusted publishing).
          script: |
            const {resolve} = require('path')
            const scriptPath = resolve("./main/.github/lib/create-projen-files")
            const script = require(scriptPath)
            script({
              providerName: "null"
            })

      - name: Synthesize provider project
        # Same resolution path as the fan-out above, so the workflows landing in
        # the template are the ones a real provider repo synthesizes: latest
        # @cdktn/provider-project, projen bootstrapped past the pnpm API floor,
        # stub tasks manifest so `npx projen` works in a virgin directory, and
        # `unset CI` so pnpm does not demand a frozen lockfile.
        run: |
          unset CI
          pnpm add -D @cdktn/provider-project@latest
          pnpm add -D projen@^0.101.20
          if [ ! -f .projen/tasks.json ]; then
            mkdir -p .projen
            printf '%s\n' '{"tasks":{"default":{"name":"default","description":"Synthesize project files","steps":[{"execArgs":["node",".projenrc.js"]}]}}}' > .projen/tasks.json
          fi
          npx projen
        working-directory: ./provider

      - name: Add headers using Copywrite tool
        # The provider repos commit these files with copyright headers applied,
        # so the template has to carry the same bytes.
        run: copywrite headers
        working-directory: ./provider

      - name: Copy template content
        run: |
          mkdir -p template/.github/workflows
          for file in pull-request-lint.yml auto-approve.yml automerge.yml; do
            if [ ! -f "provider/.github/workflows/$file" ]; then
              echo "::error::$file was not synthesized by @cdktn/provider-project. A repository generated from the template could no longer merge its first pull request unattended. Update the file list in this job and in docs/template-repo.md."
              exit 1
            fi
            # projen writes its outputs read-only (mode 444), so the previously
            # synced copy has to be removed before it can be overwritten.
            rm -f "template/.github/workflows/$file"
            cp "provider/.github/workflows/$file" "template/.github/workflows/$file"
          done
          rm -f template/README.md
          cp main/.github/template-repo/README.md template/README.md

      - name: Check for changes
        id: git_diff
        run: |
          # Use git status, not `git diff`: diff only sees tracked modifications
          # and deletions, so a run whose only effect is ADDING files goes
          # undetected. Detection has to agree with what `git add .` commits.
          [ -z "$(git status --porcelain)" ] || echo "has_changes=true" >> $GITHUB_OUTPUT
        working-directory: ./template

      - if: steps.git_diff.outputs.has_changes
        name: Commit and push changes (if changed)
        # Pushed straight to main: the template repository runs no CI and has no
        # pull request flow of its own.
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync template content from cdktn-repository-manager"
          git push origin HEAD:main
        working-directory: ./template

      - name: Send failures to Slack
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.FAILURE_SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "provider_name": "template repository sync",
              "run_url": "https://github.com/cdktn-io/cdktn-repository-manager/actions/runs/${{ github.run_id }}"
            }

  upgrade-provider:
    needs: build-provider-matrix
    name: "Upgrade"
    runs-on: ubuntu-latest
    container:
      # 0.24.0 image (cdk-terrain b91823e3d). Ships Terraform 1.15.8 alongside
      # the 1.6.5 default; the fetch below selects it via TERRAFORM_BINARY_NAME.
      image: terraconstructs/jsii-terraform@sha256:8a260318e59d1debad735c328581261f2c469584191ec50783dad135837b4127
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.build-provider-matrix.outputs.matrix)}}
      max-parallel: 5
    steps:
      - name: Checkout this repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: main

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cdktn-io
          repositories: cdktn-provider-${{ matrix.provider }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout cdktn-provider-${{ matrix.provider }} Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: cdktn-io/cdktn-provider-${{ matrix.provider }}
          token: ${{ steps.app-token.outputs.token }}
          path: provider

      # The jsii-terraform container ships yarn 1.x baked in at /usr/bin/yarn but has
      # no pnpm, so it must be installed. Must run BEFORE setup-node: setup-node's
      # `cache: pnpm` (if ever enabled) needs pnpm already on PATH.
      # The version is pinned rather than read from the provider repo's
      # `packageManager` field, because on the yarn->pnpm transition run that field
      # does not exist yet. Keep it in sync with @cdktn/provider-project's pnpm
      # version (projen's DEFAULT_PNPM_VERSION).
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "10.33.0"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Package managers *error* on an engines mismatch, so this must satisfy BOTH:
          #   - @cdktn/provider-project, engines node>=22.11.0
          #   - the provider repo itself, engines node>=22.11.0 from the template's
          #     minNodeVersion -- the install below runs inside it
          # This is tooling, so it tracks projenrc.template.js's workflowNodeVersion
          # (current LTS), NOT minNodeVersion (the consumer floor). Keep it >= the floor.
          node-version: "22"

      - name: Setup Copywrite tool
        uses: hashicorp/setup-copywrite@32638da2d4e81d56a0764aa1547882fc4d209636 # v1.1.3

      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        name: Create projen run commands file
        with:
          script: |
            const {resolve} = require('path')
            const scriptPath = resolve("./main/.github/lib/create-projen-files")
            const script = require(scriptPath)
            script({
              providerName: "${{matrix.provider}}"
            })

      - name: Upgrade provider project
        run: |
          unset CI
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -b foo-bar-${{ github.run_number }}
          pnpm add -D @cdktn/provider-project@latest
          # .projenrc.js runs under the PROVIDER REPO's own projen, not the template's.
          # @cdktn/provider-project >=0.9.0 uses pnpm APIs that only exist in projen
          # >=0.101.7 (pnpmOptions.workspaceYamlOptions,
          # PnpmWorkspaceYamlSchemaNodeLinker), while the repos are still pinned to the
          # projen that last synthed them (^0.99.74) -- so synth dies with
          # "Cannot read properties of undefined (reading 'HOISTED')".
          # pnpm won't resolve this via the peer range either, because the repo's own
          # explicit devDependency wins. Bootstrap it; later synths pin the running
          # version themselves.
          pnpm add -D projen@^0.101.20
          # First-synth bootstrap. projen 0.100.0 (PR projen#4766) removed the
          # five-year-old tryLegacySynth() fallback that ran `node .projenrc.js`
          # when no .projen/tasks.json exists, so the bare CLI now dies in a
          # virgin repo with "Unable to find projen project" -- the manifest it
          # wants is itself an output of the first synth. Seed a stub default
          # task (byte-identical in shape to what projen generates; the real
          # synth overwrites it) so `npx projen` works uniformly in virgin AND
          # established repos, keeping the task runtime's manifest env (PATH)
          # and PROJEN_DISABLE_POST handling that a direct `node .projenrc.js`
          # would bypass.
          if [ ! -f .projen/tasks.json ]; then
            mkdir -p .projen
            printf '%s\n' '{"tasks":{"default":{"name":"default","description":"Synthesize project files","steps":[{"execArgs":["node",".projenrc.js"]}]}}}' > .projen/tasks.json
          fi
          npx projen
          # `unset CI` above matters under pnpm: CI=true implies --frozen-lockfile, and
          # the `npx projen` on the line above rewrites package.json, so a frozen
          # install would fail with ERR_PNPM_OUTDATED_LOCKFILE. Explicit here too.
          pnpm install --no-frozen-lockfile
          # Transitive-only lockfile refresh for GHSA-rgw5-rvv9-x895: every provider
          # repo's committed lockfile still resolves brace-expansion to a flagged
          # version (<1.1.18 / <2.1.4), and the build's `pnpm audit --audit-level high`
          # gate fails on it. Neither `pnpm add` above nor projen's upgrade task
          # touches transitives, so the refresh has to happen here for the upgrade
          # PRs to be mergeable. No-ops (exit 0) once lockfiles resolve to patched
          # versions everywhere -- remove it then.
          pnpm update brace-expansion --depth Infinity
          # MUST be `pnpm run fetch`, never `pnpm fetch`: the latter is a pnpm builtin
          # that fetches from the lockfile, exits 0, and generates no bindings -- the
          # workflow would then find no diff and report success having done nothing.
          pnpm run fetch
          # fix the readme as it requires src/version.json to be populated
          npx projen
        working-directory: ./provider
        env:
          NODE_OPTIONS: "--max-old-space-size=7168"
          # Terraform only emits the newer protocol data in `providers schema`
          # output from these versions on: functions >=1.8, ephemeral resources
          # >=1.10, write-only attributes >=1.11. The image's default
          # `terraform` symlink is still 1.6.5 (kept so cdk-terrain's CI
          # matrices, which key off that default, stay untouched), so the fetch
          # must select the newer binary explicitly. @cdktn/provider-schema
          # resolves it from this env var; same mechanism cdk-terrain's
          # examples.yml uses. Without this, `pnpm run fetch` silently
          # generates bindings with none of the new 0.24 feature surfaces.
          TERRAFORM_BINARY_NAME: "terraform1.15.8"

      - name: Remove workflows projen no longer generates
        # @cdktn/provider-project v0.7.42 folded force-release.yml into
        # release.yml so npm/PyPI OIDC have a single trusted-publisher
        # entrypoint. projen stops *generating* the file but never deletes the
        # copy already committed, so without this it lingers in every provider
        # repo as a second, now-unmaintained publish entrypoint.
        run: rm -f .github/workflows/force-release.yml
        working-directory: ./provider

      - name: Add headers using Copywrite tool
        run: copywrite headers
        working-directory: ./provider

      - name: Check for changes
        id: git_diff
        run: |
          # Use git status, not `git diff`: diff only sees tracked modifications and
          # deletions, so a run whose only effect is ADDING files goes undetected.
          # The pnpm migration adds pnpm-lock.yaml and pnpm-workspace.yaml, and
          # `git add .` in the commit step below would stage them regardless -- so
          # detection has to agree with what actually gets committed.
          [ -z "$(git status --porcelain)" ] || echo "has_changes=true" >> $GITHUB_OUTPUT
        working-directory: ./provider

      - if: steps.git_diff.outputs.has_changes
        name: Detect breaking version changes
        id: diff_changes
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const {resolve} = require('path')
            const scriptPath = resolve("./main/.github/lib/collect-changes")
            const script = require(scriptPath)
            await script({core, exec})

      - if: steps.git_diff.outputs.has_changes
        name: Commit (${{steps.diff_changes.outputs.has_breaking_changes && 'breaking' || 'unbreaking'}}) changes and push changes (if changed)
        run: |
          git checkout -b upgrade-provider-project-${{ github.run_number }}-${{ github.run_attempt }}
          git add .
          git commit -m "${{ steps.diff_changes.outputs.commit_message }}"
          git push --set-upstream origin upgrade-provider-project-${{ github.run_number }}-${{ github.run_attempt }}
        working-directory: ./provider

      - if: steps.git_diff.outputs.has_changes
        name: "Create PR"
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          retries: 5
          retry-exempt-status-codes: 400,401,404
          script: |
            const {resolve} = require('path')
            const scriptPath = resolve("./main/.github/lib/create-pr")
            const script = require(scriptPath)
            await script({
              github,
              branchName: "upgrade-provider-project-${{ github.run_number }}-${{ github.run_attempt }}",
              prTitle: "${{ steps.diff_changes.outputs.commit_message }}",
              providerName: "${{matrix.provider}}"
            })

      - name: Send failures to Slack
        if: ${{ failure() && !cancelled() }}
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.FAILURE_SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "provider_name": "${{ matrix.provider }}",
              "run_url": "https://github.com/cdktn-io/cdktn-repository-manager/actions/runs/${{ github.run_id }}"
            }
